      <div class="action-section">
        <h2 class="action-section-title">一、这个维度到底在说什么</h2>
        <div class="action-card">
          <h3>详细解读</h3>
          <p class="text-sm text-gray-600 leading-relaxed">
          流程SOP的本质不是"把东西写下来放到抽屉里"，而是<strong>"让做对一件事不再依赖某个人的记忆和经验"</strong>。
        </p>
        <p class="text-sm text-gray-600 leading-relaxed mt-3">
          一个最常见的症状：公司里有一个老员工叫张姐，她什么都清楚，客户怎么跟进、报表怎么填、出了问题找谁。但张姐一请假，整个部门开始出乱子。张姐要离职，老板慌了。
        </p>
        <p class="text-sm text-gray-600 leading-relaxed mt-3">
          这不是张姐的问题，这是<strong>流程没有固化</strong>的问题。张姐的"大脑"里的东西，没有变成公司的"肌肉记忆"。
        </p>
        <p class="text-sm text-gray-600 leading-relaxed mt-3">
          SOP体系建设就是做这件事：<strong>识别关键流程 → 写下来 → 培训团队 → 持续改进</strong>。不是一次写100个，而是先写最重要的10个，让它们真正被用起来。
        </p>
        </div>
        <div class="action-card">
          <h3>用个例子你就明白了</h3>
          <p class="text-sm text-gray-600 leading-relaxed">
          一家做电商代运营的公司，30个人。老板最头疼的是：每个运营对接客户的方式都不一样，有人用Excel记录，有人用脑子记，有人跟客户承诺了不该承诺的事。
        </p>
        <p class="text-sm text-gray-600 leading-relaxed mt-3">
          他们花了3个月，梳理了<strong>8个核心SOP</strong>：新客户对接流程、日常报表流程、客户投诉处理流程、活动上线流程、数据复盘流程、合同续签流程、离职交接流程、跨部门协作流程。
        </p>
        <p class="text-sm text-gray-600 leading-relaxed mt-3">
          效果：新人上手时间从2周缩短到3天，客户投诉减少了60%，运营的加班时间平均减少了每周5小时。老板说："我终于不用每天接运营的电话问'这个怎么办'了。"
        </p>
        <p class="text-sm text-gray-600 leading-relaxed mt-3"><strong>SOP不是限制创造力的，是释放时间的。你把重复的事情标准了，才有精力做需要判断的事情。</strong></p>
        </div>
      </div>
      <div class="action-section">
        <h2 class="action-section-title">二、你的企业适不适合现在做</h2>
        <div class="fit-yes">
          <p class="text-sm font-bold text-green-800 mb-1">✅ 三个信号，你该动手了</p>
          <ul class="text-sm text-green-800" style="list-style:none;padding:0;"><li class="py-1">· 同一个问题被重复问超过3次，每次回答都不一样</li>
<li class="py-1">· 关键员工的离职会对业务产生显著冲击</li>
<li class="py-1">· 公司到了20人以上，老板已经没办法知道每个环节在发生什么</li></ul>
        </div>
        <div class="fit-no">
          <p class="text-sm font-bold text-red-800 mb-1">⚠️ 两个情况，先别急着上SOP</p>
          <ul class="text-sm text-red-800" style="list-style:none;padding:0;"><li class="py-1">· 公司不到10人且业务模式还在频繁变化，SOP刚写完就过时了</li>
<li class="py-1">· 老板自己不愿意遵守流程，SOP最大的敌人不是员工不执行，是老板自己绕过去</li></ul>
        </div>
        <div class="action-card">
          <h3>做之前，先想清楚这三件事</h3>
          <ul class="text-sm text-gray-600" style="list-style:none;padding:0;"><li class="py-2"><strong>1. 不是所有流程都要写</strong><br>只写"做了会影响钱、影响客户、影响质量"的核心流程。其他流程让它自然进化。</li>
<li class="py-2"><strong>2. 谁用谁来写</strong><br>不是老板写、不是HR写，是实际操作的员工来写第一版。写的目的是让下一个接手的人能看懂。</li>
<li class="py-2"><strong>3. SOP不是一次性的</strong><br>写完之后3个月内必须至少改一次。没用起来的SOP就是废纸。</li></ul>
        </div>
      </div><div class="action-section"><h2 class="action-section-title">三、90天执行路线图</h2><span class="phase-badge phase-1">Phase 1 · 第1-30天 · 盘点与排序</span><p class="text-sm text-gray-600 mb-3">这个阶段的目标不是写SOP，是搞清楚该写什么、从哪个开始。</p><div class="week-block"><span class="week-num">Week 1-2</span><p class="text-sm text-gray-700 font-bold mb-2">盘点所有现有流程</p><ul class="text-sm text-gray-600" style="list-style:none;padding:0;"><li class="py-1">· 让每个部门负责人列出"我这最常干的20件事"</li><li class="py-1">· 用<strong>模板1（流程盘点表）</strong>逐条记录</li><li class="py-1">· 特别标注：这件事如果换个人做，一天内能不能上手？</li></ul><div class="checklist"><p class="text-xs text-gray-400 mb-1">☑ 本周检查：</p><ul><li>各部门提交流程盘点表</li><li>老板过一遍，确认没有遗漏的核心流程</li></ul></div></div><div class="week-block"><span class="week-num">Week 3-4</span><p class="text-sm text-gray-700 font-bold mb-2">排出优先级</p><ul class="text-sm text-gray-600" style="list-style:none;padding:0;"><li class="py-1">· 用<strong>模板2（SOP优先级矩阵）</strong>打分：影响大不大 × 风险高不高</li><li class="py-1">· 选Top 5-8个最该先写的流程</li><li class="py-1">· 每个Top流程指定一个负责人来写初稿（谁做这个活谁来写）</li></ul><div class="checklist"><p class="text-xs text-gray-400 mb-1">☑ 本周检查：</p><ul><li>优先级矩阵完成</li><li>Top流程确定（不超过8个）</li><li>每个流程负责人已指定</li></ul></div></div><span class="phase-badge phase-2" style="margin-top:20px;">Phase 2 · 第31-60天 · 写SOP + 试用</span><p class="text-sm text-gray-600 mb-3">不追求完美，追求"另一个人能看懂、能照着做"。</p><div class="week-block"><span class="week-num">Week 5-6</span><p class="text-sm text-gray-700 font-bold mb-2">出第一版SOP</p><ul class="text-sm text-gray-600" style="list-style:none;padding:0;"><li class="py-1">· 用<strong>模板3（SOP标准模板）</strong>逐流程填写</li><li class="py-1">· 每个SOP控制在2页以内，超过就是不够精炼</li><li class="py-1">· 包含：目的、适用范围、步骤（编号）、关键检查点、常见错误</li></ul><div class="checklist"><p class="text-xs text-gray-400 mb-1">☑ 本周检查：</p><ul><li>Top流程的SOP初稿完成</li><li>每个SOP不超过2页</li></ul></div></div><div class="week-block"><span class="week-num">Week 7-8</span><p class="text-sm text-gray-700 font-bold mb-2">内部试用 + 修改</p><ul class="text-sm text-gray-600" style="list-style:none;padding:0;"><li class="py-1">· 找另一个没写过这份SOP的同事来试：给他SOP，看着他做</li><li class="py-1">· 他卡住的地方就是SOP写不清楚的地方，改</li><li class="py-1">· 第一轮修改完成后，放在团队共享文件夹/群里，让大家随时能看到</li></ul><div class="checklist"><p class="text-xs text-gray-400 mb-1">☑ 本周检查：</p><ul><li>每个SOP至少被1个非作者试用过</li><li>根据反馈完成修改</li><li>SOP存放位置已确定，全员可访问</li></ul></div></div><span class="phase-badge phase-3" style="margin-top:20px;">Phase 3 · 第61-90天 · 固化与迭代</span><p class="text-sm text-gray-600 mb-3">SOP写好了不是终点，是起点。</p><div class="week-block"><span class="week-num">Week 9-10</span><p class="text-sm text-gray-700 font-bold mb-2">培训 + 考核</p><ul class="text-sm text-gray-600" style="list-style:none;padding:0;"><li class="py-1">· 开一次简短的培训会（30分钟就够了），讲清楚每份SOP的要点</li><li class="py-1">· 把SOP的执行与绩效考核挂钩：按照SOP走是基本要求</li><li class="py-1">· 但给例外出口：遇到SOP没覆盖的情况，先按常识处理，后补充进SOP</li></ul><div class="checklist"><p class="text-xs text-gray-400 mb-1">☑ 本周检查：</p><ul><li>全员培训完成</li><li>SOP执行纳入考核</li></ul></div></div><div class="week-block"><span class="week-num">Week 11-12</span><p class="text-sm text-gray-700 font-bold mb-2">复盘 + 迭代</p><ul class="text-sm text-gray-600" style="list-style:none;padding:0;"><li class="py-1">· 收集团队反馈：哪个SOP最好用？哪个几乎没用？为什么？</li><li class="py-1">· 修改"不好用"的SOP，简化或合并</li><li class="py-1">· 制定"SOP季度审查"制度：每季度检查一次，过时的就更新</li></ul><div class="checklist"><p class="text-xs text-gray-400 mb-1">☑ 本周检查：</p><ul><li>团队反馈收集完毕</li><li>SOP更新到第二版</li><li>季度审查时间表已设定</li></ul></div></div><div class="action-card" style="text-align:center;margin-top:16px;"><p class="text-sm font-bold text-gray-800 mb-2">🏁 90天目标</p><p class="text-sm text-gray-600"><strong>5-8个核心SOP跑起来了</strong>，关键流程不再依赖个人记忆，新人培训时间显著缩短，重复性问题明显减少。</p></div></div><div class="action-section"><h2 class="action-section-title">四、配套模板</h2><p class="text-sm text-gray-500 mb-3">以下3个模板可直接使用。建议打印出来或复制到文档工具里。</p><div class="template-card"><span class="template-label">模板1</span><h3 style="font-size:15px;font-weight:700;color:#1E293B;margin-bottom:6px;">流程盘点表</h3><p class="text-sm text-gray-500 mb-3">由各部门负责人填写，列出所有经常做的事情</p><table><tr><th>序号</th><th>事情名称</th><th>频率</th><th>谁在做</th><th>换人能否一天上手</th><th>重要性</th></tr>
          <tr><td>1</td><td><span class="fill-line"></span></td><td>每日/每周/每月</td><td><span class="fill-line"></span></td><td>能/勉强/不能</td><td>高/中/低</td></tr>
          <tr><td>2</td><td><span class="fill-line"></span></td><td>每日/每周/每月</td><td><span class="fill-line"></span></td><td>能/勉强/不能</td><td>高/中/低</td></tr>
          <tr><td>3</td><td><span class="fill-line"></span></td><td>每日/每周/每月</td><td><span class="fill-line"></span></td><td>能/勉强/不能</td><td>高/中/低</td></tr>
          <tr><td>…</td><td></td><td></td><td></td><td></td><td></td></tr></table></div><div class="template-card"><span class="template-label">模板2</span><h3 style="font-size:15px;font-weight:700;color:#1E293B;margin-bottom:6px;">SOP优先级矩阵</h3><p class="text-sm text-gray-500 mb-3">给候选流程打分，影响越大、风险越高，越该先写</p><table><tr><th>流程</th><th>影响（1-5分）</th><th>风险（1-5分）</th><th>总分</th><th>排位</th></tr>
          <tr><td><span class="fill-line"></span></td><td><span class="fill-line"></span></td><td><span class="fill-line"></span></td><td><span class="fill-line"></span></td><td></td></tr>
          <tr><td><span class="fill-line"></span></td><td><span class="fill-line"></span></td><td><span class="fill-line"></span></td><td><span class="fill-line"></span></td><td></td></tr>
          <tr><td><span class="fill-line"></span></td><td><span class="fill-line"></span></td><td><span class="fill-line"></span></td><td><span class="fill-line"></span></td><td></td></tr></table><p class="text-xs text-gray-400 mt-2">影响分 = 这件事做不好对客户/收入/质量的影响有多大<br>风险分 = 这件事现在依赖"那个人"的程度有多高</p></div><div class="template-card"><span class="template-label">模板3</span><h3 style="font-size:15px;font-weight:700;color:#1E293B;margin-bottom:6px;">SOP标准模板</h3><p class="text-sm text-gray-500 mb-3">每个SOP按这个格式写，控制在一页纸</p><table><tr><th style="width:30%;">字段</th><th>内容</th></tr>
          <tr><td>SOP名称</td><td><span class="fill-line"></span></td></tr>
          <tr><td>目的</td><td>为什么要做这件事、不做会怎样</td></tr>
          <tr><td>适用范围</td><td>哪个岗位/部门使用，什么情况下触发</td></tr>
          <tr><td>步骤</td><td>1. ___ → 2. ___ → 3. ___ （每步不超过一行）</td></tr>
          <tr><td>关键检查点</td><td>做到哪一步需要停下来检查什么</td></tr>
          <tr><td>常见错误</td><td>新手最容易犯的3个错误</td></tr>
          <tr><td>相关SOP</td><td>做完这个通常下一步要做什么</td></tr>
          <tr><td>版本号</td><td>V1.0 / 日期 / 谁写的</td></tr></table></div></div><div class="action-section"><h2 class="action-section-title">五、真实案例</h2><div class="case-card"><span class="case-tag">案例1 · 制造业</span><h3 style="font-size:15px;font-weight:700;color:#1E293B;margin:8px 0;">一家40人的五金加工厂怎么从"靠老师傅"变成"靠SOP"</h3><p class="text-sm text-gray-600 leading-relaxed">
          这家厂做了12年，最核心的工序，表面处理和质检，全靠三个干了8年以上的老师傅。老师傅说"看感觉"，新工人学半年也学不会。
        </p>
        <p class="text-sm text-gray-600 leading-relaxed mt-2">
          最危机的时候：其中一个老师傅生病住院两个月，产线良品率从95%掉到72%。老板说："我这时候才意识到，我的企业建立在三个人的经验之上。"
        </p>

          <tr><td>3</td><td><span class="fill-line"></span></td><td><span class="fill-line"></span></td><td><span class="fill-line"></span></td><td><span class="fill-line"></span></td><td>顺/卡</td></tr>
          <tr><td>…</td><td></td><td></td><td></td><td></td><td></td></tr></table><p class="text-xs text-gray-400 mt-2">只画最重要5条流程。卡的地方标注原因：缺信息？没人定？两个人打架？</p></div><div class="template-card"><span class="template-label">模板2</span><h3 style="font-size:15px;font-weight:700;color:#1E293B;margin-bottom:6px;">组织架构审计表</h3><p class="text-sm text-gray-500 mb-3">逐项检查当前架构的健康度</p><table><tr><th style="width:12%;">#</th><th>检查项</th><th>是/否</th><th>备注</th></tr>
          <tr><td>1</td><td>每个岗位只向一个人汇报？</td><td></td><td><span class="fill-line"></span></td></tr>
          <tr><td>2</td><td>每个部门的职责边界清晰，没有重叠？</td><td></td><td><span class="fill-line"></span></td></tr>
          <tr><td>3</td><td>没有"谁都不管"的空白地带？</td><td></td><td><span class="fill-line"></span></td></tr>
          <tr><td>4</td><td>每个业务结果都有唯一的Owner部门？</td><td></td><td><span class="fill-line"></span></td></tr>
          <tr><td>5</td><td>有新业务/新项目的快速编队机制（不是无限开会）？</td><td></td><td><span class="fill-line"></span></td></tr></table></div><div class="template-card"><span class="template-label">模板3</span><h3 style="font-size:15px;font-weight:700;color:#1E293B;margin-bottom:6px;">新版架构一页纸</h3><p class="text-sm text-gray-500 mb-3">新架构发布时用这个模板，让每个人清楚自己的位置</p><table><tr><th style="width:25%;">区域</th><th>内容</th></tr>
          <tr><td>新架构图</td><td>（画图：部门名称+负责人+核心职责一句话）</td></tr>
          <tr><td>跟旧版的区别</td><td>1. ___ 2. ___ 3. ___ （每条不超过一行）</td></tr>
          <tr><td>我的变化</td><td>我向谁汇报、我管谁、我的OKR是什么、谁依赖我的产出</td></tr>
          <tr><td>有问题找谁</td><td>人/部门/什么时候可以找</td></tr>
          <tr><td>生效时间</td><td>从哪一天开始、有2周过渡期</td></tr></table></div></div><div class="action-section"><h2 class="action-section-title">五、真实案例</h2><div class="case-card"><span class="case-tag">案例1 · 制造业</span><h3 style="font-size:15px;font-weight:700;color:#1E293B;margin:8px 0;">一家年营收1.2亿的机械加工厂，用一次架构调整节省了20%的管理成本</h3><p class="text-sm text-gray-600 leading-relaxed">
          这家厂200人，原来的架构是按工序分的：下料车间、加工车间、焊接车间、装配车间、质检科、仓库。每个车间一个主任，各管一摊。问题出在"跨车间的活没人管"。
        </p>
        <p class="text-sm text-gray-600 leading-relaxed mt-2">
          一个订单从下料到出厂，要经过5个车间，每个车间都有自己的排产计划。A车间拼命赶，做完放一边；B车间正在忙别的，接不到。订单在车间之间"漂"的时间占了总生产时间的35%。
        </p>
        <p class="text-sm text-gray-600 leading-relaxed mt-2"><strong>他们做了什么事：</strong></p>
        <ul class="text-sm text-gray-600" style="list-style:none;padding:0;">
          <li class="py-1">· 把按工序分的架构改成按产品线分的架构：A产品线（标准件）、B产品线（定制件）、C产品线（维修件）</li>
          <li class="py-1">· 每条产品线内部包含完整工序，由一个产品线经理统一管排产</li>
          <li class="py-1">· 车间主任不再按车间考核，是按产品线的"按时交付率"考核</li>
          <li class="py-1">· 质检和仓库独立，向厂长汇报，不受产品线控制（保留跨产品线的标准一致性）</li>
          <li class="py-1">· 效果：订单平均交付时间从18天缩短到11天，管理岗位减少了3个</li>
        </ul>
        <p class="text-sm text-gray-600 leading-relaxed mt-2">
          <strong>关键教训：</strong>工序导向的架构是"我干好我这道工序就行了"，产品线导向的架构是"我负责这个产品从原材料到客户手里"。后者对结果负责，前者只对过程负责。
        </p></div><div class="case-card"><span class="case-tag">案例2 · 互联网行业</span><h3 style="font-size:15px;font-weight:700;color:#1E293B;margin:8px 0;">一家从35人涨到90人的技术公司，中间那一次"架构对了"救了命</h3><p class="text-sm text-gray-600 leading-relaxed">
          这家公司做企业SaaS，从35人到90人只用了不到一年。业务涨得飞快，但组织几乎散架了。最大的问题：原来扁平结构，老板直接管7个人，在35人时还好，到了90人时，老板成了全公司最大的瓶颈。所有决策、所有跨部门协调、所有招人，全部卡在他一个人那里。
        </p>
        <p class="text-sm text-gray-600 leading-relaxed mt-2">
          他们做了一次"加层"的架构调整：
        </p>
        <ul class="text-sm text-gray-600" style="list-style:none;padding:0;">
          <li class="py-1">· 在老板和一线之间加了一层"事业部负责人"：产品事业部、交付事业部、增长事业部</li>
          <li class="py-1">· 每个事业部的负责人对这条线的"收入+成本+团队"负全责</li>
          <li class="py-1">· 老板只管三件事：战略方向、事业部负责人的OKR和考核、跨事业部的大项目协调</li>
          <li class="py-1">· 刚调整完第一个月最难，中层觉得"以前我能直接找老板，现在要过一层"</li>
          <li class="py-1">· 到第三个月效果出来了：产品迭代速度从每月1版变成每周1版，客户需求响应时间从3天降到半天</li>
        </ul>
        <p class="text-sm text-gray-600 leading-relaxed mt-2">
          <strong>最关键的细节：</strong>不是直接找三个"总监"来顶。是先让最有潜力的三个人见习两个月，以"代理负责人"身份干活，两个月后能扛住的才正式任命。三个人里有一个没扛住，调去做了技术专家。这个过渡机制避免了"上去了下不来"的尴尬。
        </p></div></div><div class="action-section"><h2 class="action-section-title">六、90天自我检查清单</h2><div class="action-card"><h3>第30天检查</h3><ul class="text-sm text-gray-600" style="list-style:none;padding:0;"><li class="py-1">☐ 5条核心业务流程图完成了吗？卡点标注了责任人吗？</li><li class="py-1">☐ 架构审计表填完并评分了吗？高层的优先级共识有了吗？</li><li class="py-1">☐ 最突出的2-3个架构问题列出来了吗？有解决方案了吗？</li></ul></div><div class="action-card"><h3>第60天检查</h3><ul class="text-sm text-gray-600" style="list-style:none;padding:0;"><li class="py-1">☐ 多头汇报情况处理完了吗？每个岗位都只有一个主汇报人了吗？</li><li class="py-1">☐ 新业务独立出来了吗？有唯一负责人和90天目标了吗？</li><li class="py-1">☐ 新架构的过渡方案写出来了吗？（怎么从旧切换到新，不停摆）</li></ul></div><div class="action-card"><h3>第90天检查</h3><ul class="text-sm text-gray-600" style="list-style:none;padding:0;"><li class="py-1">☐ 新架构全员沟通会完成了吗？每个员工知道自己向谁汇报和新的OKR了吗？</li><li class="py-1">☐ 新架构下跑了完整业务周了吗？跨部门还在卡吗？</li><li class="py-1">☐ 至少1-2处微调完成了吗？新架构V1.1定版了吗？</li></ul></div><div class="action-card" style="text-align:center;border:2px solid #93C5FD;background:#EFF6FF;"><p class="text-sm text-gray-700 leading-relaxed">🏁 <strong>90天结束后，最重要的一件事</strong><br>不是看架构图画得多漂亮，是看<strong>跨部门的事能不能在不经老板协调的情况下顺畅流转</strong>。<br>如果以前需要老板协调的跨部门问题减少了50%以上，架构调对了。</p></div></div>`,
    };

    // Generate header with "共X个维度"
    var titleText = dims.length > 1 ? '组织升级方案（共' + dims.length + '个维度）' : (HEADERS[dimStr] && HEADERS[dimStr].title || '组织升级');
    var subtitleText = dims.length > 1 ? '一次解决你的全部薄弱环节' : (HEADERS[dimStr] && HEADERS[dimStr].subtitle || '');
    document.getElementById('pageHeader').innerHTML =
      '<div class="inline-block px-4 py-1 rounded-full text-white text-sm font-bold mb-3" style="background:linear-gradient(135deg,#0F4C81,#1E40AF);">组织升级方案</div>' +
      '<h1 class="text-2xl font-extrabold text-gray-900 mb-2">' + titleText + '</h1>' +
      '<p class="text-base text-gray-500">90天执行手册</p>' +
      '<p class="text-sm text-gray-400 mt-1">' + subtitleText + '</p>';

    // Render content: loop through all dims and concatenate
    var contentHtml = '';
    for (var i = 0; i < dims.length; i++) {
      var d = dims[i];
      var hd = HEADERS[d] || HEADERS['0'];
      // Divider line between dimensions
      if (i > 0) {
        contentHtml += '<div style="height:2px;background:linear-gradient(90deg,transparent,#93C5FD,transparent);margin:24px 0 20px;"></div>';
      }
      // Dimension header badge + title (always shown)
      contentHtml += '<div class="action-section" style="text-align:center;padding-bottom:8px;">' +
        '<div class="inline-block px-4 py-1 rounded-full text-white text-sm font-bold" style="background:linear-gradient(135deg,#0F4C81,#1E40AF);">' + hd.badge + '</div>' +
        '<h2 class="text-xl font-extrabold text-gray-900 mt-3">' + hd.title + '</h2>' +
        '</div>';
      contentHtml += (CONTENTS[d] || CONTENTS['0']);
    }
    document.getElementById('dimContent').innerHTML = contentHtml;

    // Update page title
    document.title = titleText + ' · 组织升级方案';
    document.querySelector('meta[name="description"]').setAttribute('content', titleText + ' - 90天执行手册');
  </script>
